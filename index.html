<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Sudoku</title>
  <meta name="description" content="Ad-free, offline Sudoku. Four difficulties, a daily puzzle, and your stats.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#f3f5fa">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="sudoku.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="home" class="screen"></main>

  <main id="game" class="screen" hidden>
    <header class="g-head">
      <button class="icon-btn back" data-act="home" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg></button>
      <div class="counter" id="counter">0/0</div>
      <div class="head-right">
        <button class="icon-btn" data-act="restart" aria-label="Restart or new game"><svg viewBox="0 0 24 24"><path d="M19.5 10.5A7.6 7.6 0 0 0 6 7.2"/><path d="M5.6 3.6v4h4"/><path d="M4.5 13.5A7.6 7.6 0 0 0 18 16.8"/><path d="M18.4 20.4v-4h-4"/></svg></button>
        <button class="icon-btn" data-act="pause" aria-label="Pause"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg></button>
        <button class="icon-btn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      </div>
    </header>

    <section class="g-stats">
      <div class="stat" id="st-first"><span class="lbl">This Week</span><span class="val" id="st-week"></span></div>
      <div class="stat"><span class="lbl">Difficulty</span><span class="val" id="st-level"></span></div>
      <div class="stat"><span class="lbl">Score</span><span class="val" id="st-score"></span></div>
      <div class="stat"><span class="lbl">Mistakes</span><span class="val" id="st-mistakes"></span></div>
    </section>

    <section class="board-wrap" id="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
      <div class="pause-veil" id="pause-veil" hidden>
        <div class="pv-title">Paused</div>
        <div class="pv-sub" id="pv-time"></div>
        <button class="big-btn" style="width:200px" data-act="resume">Resume</button>
      </div>
    </section>

    <section class="tools">
      <button class="tool" data-act="undo"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9L4 8.5"/><path d="M4 3.5v5h5"/></svg><span>Undo</span></button>
      <button class="tool" data-act="erase"><svg viewBox="0 0 24 24"><path d="M5.3 14.3 14 5.6a2 2 0 0 1 2.8 0l2.6 2.6a2 2 0 0 1 0 2.8L11.6 19H8.4l-3.1-3.1a1.1 1.1 0 0 1 0-1.6z"/><path d="M9.6 10.3l5.1 5.1"/><path d="M14.5 21h5"/></svg><span>Erase</span></button>
      <button class="tool" data-act="notes" id="notes-btn"><svg viewBox="0 0 24 24"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="M14.5 21h5"/></svg><span>Notes</span><i class="badge" id="notes-badge">OFF</i></button>
      <button class="tool" data-act="hint"><svg viewBox="0 0 24 24"><path d="M9.5 18h5"/><path d="M10.5 21h3"/><path d="M12 3a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.7V17h6v-.5c0-.7.3-1.3.8-1.7A6.5 6.5 0 0 0 12 3z"/></svg><span>Hint</span></button>
    </section>

    <section class="pad" id="pad"></section>
  </main>

  <main id="stats" class="screen" hidden></main>

  <nav class="tabbar" id="tabbar">
    <button data-act="tab-home" id="tab-home"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg><span>Play</span></button>
    <button data-act="tab-stats" id="tab-stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Statistics</span></button>
  </nav>

  <div class="sheet-root" id="sheet-root" hidden>
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
